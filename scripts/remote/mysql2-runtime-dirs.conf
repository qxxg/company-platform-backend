# MySQL 第二实例（3307）systemd drop-in。
#
# 背景：mysql2.service 的 ExecStartPre 以 mysql 用户执行
#   mkdir -p /run/mysqld2 /var/log/mysql2
# 主机重启后 /run 为 tmpfs，mysql 用户无法在根目录创建 /run/mysqld2，
# 导致服务反复失败。由 systemd 先按 User=mysql 创建运行时/日志目录，
# 再执行原有 ExecStartPre 即可幂等通过。
#
# 安装：
#   sudo mkdir -p /etc/systemd/system/mysql2.service.d
#   sudo cp mysql2-runtime-dirs.conf /etc/systemd/system/mysql2.service.d/runtime-dirs.conf
#   sudo systemctl daemon-reload
#   sudo systemctl reset-failed mysql2.service
#   sudo systemctl start mysql2.service

[Service]
RuntimeDirectory=mysqld2
RuntimeDirectoryMode=0755
LogsDirectory=mysql2
LogsDirectoryMode=0750
