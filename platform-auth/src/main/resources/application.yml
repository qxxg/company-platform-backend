# 认证中心配置。
# 只使用 Nacos 做服务发现，不启用 Nacos Config；配置仍以本文件 + 环境变量为准。
server:
  port: 9000

spring:
  application:
    name: platform-auth
  cloud:
    nacos:
      discovery:
        # Nacos 注册中心地址；生产环境应改为集群 VIP 或域名。
        server-addr: ${NACOS_SERVER_ADDR:192.168.3.44:8848}
        # 显式指定注册 IP，避免把虚拟网卡 192.168.56.1 注册进去。
        ip: ${NACOS_CLIENT_IP:192.168.3.43}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        namespace: ${NACOS_NAMESPACE:}
        register-enabled: true
  datasource:
    # 认证库保存用户、角色、权限和 OAuth2 授权记录。
    # 连接使用 UTC 会话时区，授权记录中的时间戳在跨时区部署时仍然稳定。
    url: jdbc:mysql://192.168.3.44:3306/company_platform?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&preserveInstants=true&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: company_app
    password: Company@2026
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      initialization-fail-timeout: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  auth:
    # issuer 必须与浏览器访问认证中心的地址一致，否则 OIDC 发现和令牌 iss 校验会失败。
    issuer: ${AUTH_ISSUER:http://localhost:9000}
    # 开发密钥库；生产必须替换，并通过环境变量注入密码，禁止使用仓库内默认文件。
    keystore: classpath:auth-jwt.p12
    store-password: ${AUTH_KEYSTORE_PASSWORD:changeit}
    key-alias: auth
    key-password: ${AUTH_KEY_PASSWORD:changeit}
    clients:
      # ops-client 的 secret，仅用于运维/冒烟测试；生产必须覆盖。
      ops-secret: ${OPS_CLIENT_SECRET:ops-secret-2026}
  seed:
    # 生产环境必须设为 false，并删除/禁用默认账号。
    enabled: ${APP_SEED_ENABLED:true}
    admin-password: ${ADMIN_PASSWORD:Admin@123}
    sales-password: ${SALES_PASSWORD:Sales@123}
    manager-password: ${MANAGER_PASSWORD:Manager@123}
  cors:
    # 允许 PC Web 开发服务器直接请求令牌端点。
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://192.168.3.43:5173
      - http://192.168.3.50
      - http://192.168.3.50:5173
      - http://localhost:3000
      - http://localhost:8080

logging:
  level:
    com.company.platform: INFO
    org.springframework.security: INFO
